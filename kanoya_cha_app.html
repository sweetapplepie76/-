<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹿屋茶生産支援アプリ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1a12;
      --bg2: #112318;
      --bg3: #1a3326;
      --card: #162b1e;
      --border: #2a4a34;
      --green: #4ade80;
      --green2: #22c55e;
      --green3: #16a34a;
      --teal: #2dd4bf;
      --amber: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --text: #e8f5e9;
      --text2: #9dbfa8;
      --text3: #5a8a6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ヘッダー */
    .header {
      background: linear-gradient(180deg, #0b2218 0%, var(--bg) 100%);
      padding: 20px 16px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -30px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 120px;
      background: radial-gradient(ellipse, rgba(74,222,128,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .header h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 22px;
      color: var(--green);
      letter-spacing: 0.05em;
    }
    .header .org {
      font-size: 11px;
      color: var(--text3);
      margin-top: 4px;
      letter-spacing: 0.08em;
    }
    .header .date-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      background: var(--bg3);
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 20px;
      padding: 3px 12px;
    }

    /* タブナビ */
    .tab-nav {
      display: flex;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 4px;
      font-size: 11px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 500;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border-bottom: 2px solid transparent;
    }
    .tab-btn .icon { font-size: 18px; }
    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }
    .tab-btn:hover { color: var(--text); }

    /* セクション */
    .section { display: none; padding: 16px; }
    .section.active { display: block; }

    /* ── TAB 1: 栽培暦 ── */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .cal-title { font-family: 'Shippori Mincho', serif; font-size: 17px; color: var(--green); }
    .month-nav { display: flex; gap: 8px; align-items: center; }
    .month-nav button {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px;
      width: 32px; height: 32px; cursor: pointer; font-size: 16px;
    }
    .month-nav button:hover { border-color: var(--green); color: var(--green); }
    #monthLabel { font-size: 14px; min-width: 60px; text-align: center; }

    .cal-timeline {
      position: relative;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: 110px repeat(12, 40px);
      min-width: 600px;
    }
    .cal-month-header {
      background: var(--bg3);
      text-align: center;
      font-size: 11px;
      padding: 6px 0;
      border-right: 1px solid var(--border);
      color: var(--text2);
    }
    .cal-month-header.current-month {
      color: var(--green);
      background: rgba(74,222,128,0.1);
    }
    .cal-row-label {
      font-size: 12px;
      padding: 6px 8px;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .cal-cell {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      height: 34px;
      position: relative;
    }
    .cal-bar {
      position: absolute;
      top: 8px; bottom: 8px;
      border-radius: 4px;
      opacity: 0.85;
    }
    .bar-main { background: var(--green3); }
    .bar-harvest { background: var(--amber); }
    .bar-pest { background: var(--red); }
    .bar-fert { background: var(--teal); }

    .cal-legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-top: 12px; font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; }

    /* 今月の作業 */
    .task-cards { margin-top: 16px; }
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .task-card-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    .task-name { font-size: 14px; font-weight: 700; }
    .task-tag {
      font-size: 10px; padding: 2px 8px;
      border-radius: 10px; font-weight: 500;
    }
    .tag-harvest { background: rgba(251,191,36,0.2); color: var(--amber); }
    .tag-fert    { background: rgba(45,212,191,0.2); color: var(--teal); }
    .tag-pest    { background: rgba(248,113,113,0.2); color: var(--red); }
    .tag-manage  { background: rgba(74,222,128,0.2);  color: var(--green); }
    .task-detail { font-size: 12px; color: var(--text2); line-height: 1.6; }

    /* ── TAB 2: 気象・積算温度 ── */
    .weather-top {
      background: linear-gradient(135deg, var(--bg3), var(--card));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .weather-now {
      display: flex; align-items: center; gap: 16px;
    }
    .weather-icon { font-size: 48px; }
    .weather-temp { font-size: 42px; font-weight: 300; color: var(--text); }
    .weather-temp sup { font-size: 18px; color: var(--text2); }
    .weather-info { font-size: 12px; color: var(--text2); line-height: 2; }

    .temp-section { margin-top: 16px; }
    .temp-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 15px; color: var(--teal);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .temp-input-row {
      display: flex; gap: 10px; margin-bottom: 12px;
    }
    .temp-input-row input {
      flex: 1;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      padding: 10px 12px; font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .temp-input-row input:focus {
      outline: none; border-color: var(--teal);
    }
    .temp-input-row button {
      background: var(--teal); color: #0b1a12;
      border: none; border-radius: 8px;
      padding: 0 16px; font-weight: 700;
      font-size: 13px; cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .accum-bar-bg {
      background: var(--bg3); border-radius: 8px;
      height: 20px; overflow: hidden; margin-bottom: 6px;
    }
    .accum-bar-fill {
      height: 100%; border-radius: 8px;
      background: linear-gradient(90deg, var(--teal), var(--green));
      transition: width 0.6s ease;
    }
    .accum-label {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--text2); margin-bottom: 12px;
    }
    .threshold-cards {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .thresh-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }
    .thresh-name { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
    .thresh-val { font-size: 16px; font-weight: 700; }
    .thresh-remain { font-size: 11px; margin-top: 3px; }
    .ok { color: var(--green); }
    .warn { color: var(--amber); }
    .over { color: var(--red); }

    /* 週間予報 */
    .forecast-row {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 4px 0 8px;
    }
    .forecast-day {
      flex-shrink: 0;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
      text-align: center; min-width: 68px;
    }
    .fc-day { font-size: 11px; color: var(--text2); }
    .fc-icon { font-size: 24px; margin: 4px 0; }
    .fc-high { font-size: 14px; font-weight: 700; }
    .fc-low { font-size: 11px; color: var(--text2); }

    /* ── TAB 3: 農薬検索 ── */
    .search-box {
      width: 100%;
      padding: 12px 16px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-size: 14px; margin-bottom: 14px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .search-box:focus { outline: none; border-color: var(--green); }
    .filter-chips {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .chip {
      font-size: 11px; padding: 4px 12px;
      border-radius: 20px; border: 1px solid var(--border);
      background: var(--card); color: var(--text2);
      cursor: pointer; transition: all 0.2s;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .chip.active { background: var(--green3); border-color: var(--green); color: var(--text); }
    .pest-card {
      background: var(--card); border-left: 3px solid var(--green3);
      border-radius: 10px; padding: 14px; margin-bottom: 12px;
    }
    .pest-card.disease { border-left-color: var(--red); }
    .pest-card.weed   { border-left-color: var(--amber); }
    .pest-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .pest-name-main { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .pest-category {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      background: rgba(74,222,128,0.15); color: var(--green); flex-shrink: 0;
    }
    .pest-category.disease { background: rgba(248,113,113,0.15); color: var(--red); }
    .pest-category.weed { background: rgba(251,191,36,0.15); color: var(--amber); }
    .info-row { font-size: 13px; margin: 4px 0; }
    .info-label { color: var(--text3); font-weight: 500; margin-right: 4px; }
    .note-box {
      margin-top: 8px; font-size: 11px;
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
      border-radius: 6px; padding: 8px 10px;
      color: var(--amber); line-height: 1.6;
    }

    /* ── TAB 4: 製茶工程 ── */
    .process-tabs {
      display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto;
    }
    .ptab {
      flex-shrink: 0; padding: 7px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text2);
      font-size: 12px; cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      transition: all 0.2s;
    }
    .ptab.active {
      background: var(--green3); border-color: var(--green);
      color: var(--text); font-weight: 700;
    }
    .process-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 14px;
    }
    .process-step-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 16px; color: var(--green);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .step-badge {
      background: var(--green3); color: var(--text);
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .param-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .param-table th {
      background: var(--bg3); color: var(--text2);
      padding: 7px 10px; text-align: left;
      font-weight: 500; font-size: 11px;
      border-bottom: 1px solid var(--border);
    }
    .param-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .param-table tr:last-child td { border-bottom: none; }
    .param-val { color: var(--teal); font-weight: 700; }
    .process-note {
      margin-top: 10px; font-size: 12px;
      background: rgba(45,212,191,0.08);
      border: 1px solid rgba(45,212,191,0.2);
      border-radius: 6px; padding: 10px 12px;
      color: var(--teal); line-height: 1.7;
    }
    .memo-area {
      width: 100%;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      padding: 10px 12px; font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      resize: vertical; min-height: 90px;
      margin-top: 8px;
    }
    .memo-area:focus { outline: none; border-color: var(--green); }
    .save-btn {
      background: var(--green3); color: var(--text);
      border: none; border-radius: 8px;
      padding: 9px 20px; font-size: 13px;
      font-weight: 700; cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      margin-top: 8px;
    }
    .save-btn:hover { background: var(--green2); }
    .save-ok {
      font-size: 12px; color: var(--green);
      margin-left: 10px; opacity: 0;
      transition: opacity 0.3s;
    }
    .save-ok.show { opacity: 1; }

    .no-result { text-align: center; color: var(--text3); padding: 30px; font-size: 13px; }
  </style>
</head>
<body>

<div class="header">
  <div class="header::before"></div>
  <h1>🍵 鹿屋茶生産支援アプリ</h1>
  <div class="org">大隅地域振興局 農業普及課</div>
  <div class="date-badge" id="todayBadge"></div>
</div>

<!-- タブナビ -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('calendar',this)">
    <span class="icon">📅</span>栽培暦
  </button>
  <button class="tab-btn" onclick="switchTab('weather',this)">
    <span class="icon">🌡️</span>気象
  </button>
  <button class="tab-btn" onclick="switchTab('pesticide',this)">
    <span class="icon">🔍</span>農薬
  </button>
  <button class="tab-btn" onclick="switchTab('process',this)">
    <span class="icon">⚙️</span>製茶
  </button>
</nav>

<!-- ======== TAB 1: 栽培暦 ======== -->
<div id="tab-calendar" class="section active">
  <div class="cal-header">
    <div class="cal-title">📅 年間栽培暦</div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="cal-timeline">
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="cal-legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green3)"></div>管理作業</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>摘採</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>病害虫防除</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--teal)"></div>施肥</div>
  </div>

  <div class="task-cards">
    <div style="font-family:'Shippori Mincho',serif; font-size:15px; color:var(--amber); margin:16px 0 10px; display:flex; align-items:center; gap:6px;">
      ⚑ <span id="thisMonthLabel"></span>の主な作業
    </div>
    <div id="taskList"></div>
  </div>
</div>

<!-- ======== TAB 2: 気象・積算温度 ======== -->
<div id="tab-weather" class="section">

  <div class="weather-top">
    <div style="font-family:'Shippori Mincho',serif; font-size:14px; color:var(--teal); margin-bottom:12px;">鹿屋市 現在の気象（参考）</div>
    <div class="weather-now">
      <div class="weather-icon">⛅</div>
      <div>
        <div class="weather-temp">22<sup>℃</sup></div>
        <div class="weather-info">
          湿度：68%　風速：3.2m/s<br>
          日照：4.5h　降水：0mm
        </div>
      </div>
    </div>
  </div>

  <!-- 週間予報 -->
  <div style="font-family:'Shippori Mincho',serif; font-size:14px; color:var(--text2); margin-bottom:10px;">週間予報</div>
  <div class="forecast-row" id="forecastRow"></div>

  <!-- 積算温度 -->
  <div class="temp-section">
    <div class="temp-title">🌡️ 積算温度管理</div>
    <div class="temp-input-row">
      <input type="number" id="todayTemp" placeholder="今日の最高気温 (℃)" step="0.1">
      <button onclick="addTemp()">追加</button>
    </div>
    <div style="font-size:12px; color:var(--text2); margin-bottom:8px;">
      基準温度：10℃ | 積算開始：4月1日
    </div>
    <div class="accum-bar-bg">
      <div class="accum-bar-fill" id="accumBar" style="width:0%"></div>
    </div>
    <div class="accum-label">
      <span>積算温度：<b id="accumVal">0</b>℃・日</span>
      <span id="accumReset" onclick="resetAccum()" style="cursor:pointer; color:var(--text3);">リセット</span>
    </div>
    <div class="threshold-cards" id="threshCards"></div>
  </div>
</div>

<!-- ======== TAB 3: 農薬検索 ======== -->
<div id="tab-pesticide" class="section">
  <input type="text" id="searchBar" class="search-box" placeholder="🔍 病害虫名・薬剤名で検索...">
  <div class="filter-chips">
    <div class="chip active" data-filter="all" onclick="setFilter(this)">すべて</div>
    <div class="chip" data-filter="insect" onclick="setFilter(this)">害虫</div>
    <div class="chip" data-filter="disease" onclick="setFilter(this)">病害</div>
    <div class="chip" data-filter="mite" onclick="setFilter(this)">ダニ</div>
  </div>
  <div id="pestList"></div>
</div>

<!-- ======== TAB 4: 製茶工程 ======== -->
<div id="tab-process" class="section">
  <div class="process-tabs" id="processTabs"></div>
  <div id="processContent"></div>
</div>


<script>
// ===========================
// 共通
// ===========================
const today = new Date();
document.getElementById('todayBadge').textContent =
  today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日（' +
  ['日','月','火','水','木','金','土'][today.getDay()] + '）';

function switchTab(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}


// ===========================
// TAB 1: 栽培暦データ
// ===========================
// rows: { label, type(main/harvest/pest/fert), months: [[start,end], ...] }
// months 1-12 の中で [start,end] は 0-1 の比率
const calRows = [
  { label: '整枝・刈り込み', type:'main',    bars:[[1,0,1],[2,0,1],[3,0,0.5],[11,0,1],[12,0,1]] },
  { label: '施肥（元肥）',    type:'fert',    bars:[[2,0,1],[3,0,1]] },
  { label: '施肥（追肥）',    type:'fert',    bars:[[5,0,0.5],[7,0,0.5],[9,0,0.5]] },
  { label: '一番茶摘採',      type:'harvest', bars:[[4,0.4,1],[5,0,0.6]] },
  { label: '二番茶摘採',      type:'harvest', bars:[[6,0.3,1],[7,0,0.5]] },
  { label: '三番茶摘採',      type:'harvest', bars:[[8,0,0.7]] },
  { label: '秋整枝',          type:'main',    bars:[[8,0.7,1],[9,0,1]] },
  { label: '病害虫防除',      type:'pest',    bars:[[5,0.5,1],[6,0,0.5],[8,0,0.5],[9,0,1]] },
];

const barColorMap = { main:'var(--green3)', harvest:'var(--amber)', pest:'var(--red)', fert:'var(--teal)' };

let currentMonth = today.getMonth() + 1; // 1-12

const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function buildCalGrid() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // ヘッダー行
  const cornerCell = document.createElement('div');
  cornerCell.style.cssText = 'background:var(--bg2); padding:6px 0; font-size:11px; color:var(--text3); text-align:center; border-right:1px solid var(--border); border-bottom:1px solid var(--border);';
  cornerCell.textContent = '作業項目';
  grid.appendChild(cornerCell);

  for (let m = 1; m <= 12; m++) {
    const cell = document.createElement('div');
    cell.className = 'cal-month-header' + (m === currentMonth ? ' current-month' : '');
    cell.textContent = m + '月';
    grid.appendChild(cell);
  }

  // データ行
  calRows.forEach(row => {
    const label = document.createElement('div');
    label.className = 'cal-row-label';
    label.textContent = row.label;
    grid.appendChild(label);

    for (let m = 1; m <= 12; m++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (m === currentMonth) cell.style.background = 'rgba(74,222,128,0.05)';

      const bar = row.bars.find(b => b[0] === m);
      if (bar) {
        const fill = document.createElement('div');
        fill.className = 'cal-bar';
        fill.style.background = barColorMap[row.type];
        fill.style.left = (bar[1] * 100) + '%';
        fill.style.right = ((1 - bar[2]) * 100) + '%';
        cell.appendChild(fill);
      }
      grid.appendChild(cell);
    }
  });
}

  currentMonth = ((currentMonth - 1 + dir + 12) % 12) + 1;
  document.getElementById('monthLabel').textContent = currentMonth + '月';

}

const thresholds = [
  { name: 'クワシロカイガラムシ（1齢幼虫）', target: 180, desc: '防除開始' },
  { name: 'チャノナガサビダニ', target: 150, desc: '発生ピーク' },
  { name: '一番茶萌芽目安', target: 100, desc: '摘採準備' },

];

let accumTemp = parseFloat(localStorage.getItem('accumTemp') || '0');

function updateAccum() {
  const maxTarget = Math.max(...thresholds.map(t => t.target));
  const pct = Math.min(100, (accumTemp / maxTarget) * 100);
  document.getElementById('accumBar').style.width = pct + '%';
  document.getElementById('accumVal').textContent = accumTemp.toFixed(1);

  document.getElementById('threshCards').innerHTML = thresholds.map(t => {
    const remain = t.target - accumTemp;
    let cls = remain > 20 ? 'ok' : remain > 0 ? 'warn' : 'over';
    let status = remain > 0 ? `あと ${remain.toFixed(0)}℃・日` : '⚠ 到達済み';
    return `
      <div class="thresh-card">
        <div class="thresh-name">${t.name}</div>
        <div class="thresh-val ${cls}">${t.target}℃・日</div>
        <div class="thresh-remain ${cls}">${t.desc}：${status}</div>
      </div>`;
  }).join('');
}

function addTemp() {
  const val = parseFloat(document.getElementById('todayTemp').value);
  if (isNaN(val)) return;
  const effective = Math.max(0, val - 10);
  accumTemp = Math.round((accumTemp + effective) * 10) / 10;
  localStorage.setItem('accumTemp', accumTemp);
  document.getElementById('todayTemp').value = '';
  updateAccum();
}

function resetAccum() {
  if (confirm('積算温度をリセットしますか？')) {
    accumTemp = 0;
    localStorage.setItem('accumTemp', 0);
    updateAccum();
  }
}
